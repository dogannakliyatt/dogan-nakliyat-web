<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doğan Nakliyat Yönetim</title><style>body{font:16px system-ui;background:#f3f6fb;color:#17263d;margin:0;padding:24px}main{max-width:740px;margin:auto}section{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 24px #10213c12}label{display:block;margin:16px 0 5px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aab8ca;border-radius:8px;font:inherit}button{margin-top:18px;background:#10213c;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}#status{white-space:pre-wrap}</style></head><body><main><h1>Doğan Nakliyat — Yönetim</h1><p>Yönetici şifrenizle güvenli giriş yapın.</p><section><form id="loginForm"><label for="password">Yönetici şifresi</label><input id="password" type="password" autocomplete="current-password" required><button>Giriş yap</button></form><button id="logout" type="button" hidden>Çıkış yap</button><form id="form" hidden><label for="key">Düzenlenecek alan</label><select id="key"><option value="heroTitle">Ana başlık</option><option value="heroSubtitle">Alt başlık</option><option value="phone">Telefon</option><option value="whatsapp">WhatsApp</option><option value="serviceDescription">Hizmet açıklaması</option></select><label for="value">İçerik</label><textarea id="value" rows="5" maxlength="2000" required></textarea><button>Kaydet</button></form><div id="sectionPanel" hidden><h2>Sayfa bölümleri</h2><p>Başlık ve açıklamaları ayrı ayrı düzenle.</p><label for="sectionSelect">Bölüm</label><select id="sectionSelect"></select><label for="sectionField">Alan</label><select id="sectionField"><option value="title">Başlık</option><option value="description">Açıklama</option></select><label for="sectionValue">İçerik</label><textarea id="sectionValue" rows="5" maxlength="1500"></textarea><button id="saveSection" type="button">Bölümü kaydet</button><p id="sectionStatus" role="status"></p></div><div id="contentPanel" hidden><h2>Firma, tasarım ve SEO</h2><p>Değişiklikler kaydedildikten sonra sitede görünür. Görseller için bu sürümde sitedeki mevcut HTTPS dosya adreslerini kullan.</p><label for="contentKey">Düzenlenecek ayar</label><select id="contentKey"></select><label for="contentValue">Değer</label><textarea id="contentValue" rows="3" maxlength="2000"></textarea><button id="contentSave" type="button">Ayarı kaydet</button><p id="contentStatus" role="status"></p></div><p id="status" role="status"></p></section></main><script>const contentDefs={"businessName":"Firma adı","phone":"Telefon","whatsapp":"WhatsApp numarası","email":"E-posta","address":"Adres / bölge","hours":"Çalışma saatleri","seoTitle":"SEO sayfa başlığı","seoDescription":"SEO açıklaması","primaryColor":"Ana renk (#10213c)","accentColor":"Vurgu rengi (#16a34a)","logoUrl":"Logo URL (aynı site, https)","bannerUrl":"Kapak görseli URL (aynı site, https)","reviewUrl":"Yorum bırakma URL (aynı site)","googlePlaceId":"Google Place ID (hazırlık)","footerText":"Alt bilgi yazısı","hideReviews":"Yorumları gizle (true/false)","hideGallery":"Galeriyi gizle (true/false)","showOfferForm":"Teklif formunu göster (true/false)"};
const contentSelect=document.querySelector("#contentKey"),contentValue=document.querySelector("#contentValue"),contentStatus=document.querySelector("#contentStatus");let contentData={};
for(const [id,title] of Object.entries(contentDefs)){const opt=document.createElement("option");opt.value=id;opt.textContent=title;contentSelect.append(opt)}
function updateContent(){contentValue.value=contentData[contentSelect.value]||""}
contentSelect.addEventListener("change",updateContent);
async function loadContent(){try{const r=await fetch("/api/admin/content");if(!r.ok)throw Error("Ayarlar okunamadı");contentData=await r.json();document.querySelector("#contentPanel").hidden=false;updateContent()}catch(e){contentStatus.textContent=e.message}}
document.querySelector("#contentSave").addEventListener("click",async()=>{contentStatus.textContent="Kaydediliyor...";try{const body={key:contentSelect.value,value:contentValue.value};const r=await fetch("/api/admin/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||"Kaydedilemedi");contentData[body.key]=body.value;contentStatus.textContent="Kaydedildi"}catch(e){contentStatus.textContent=e.message}});
const secNames={"anasayfa":"Ana sayfa","hizmetler":"Hizmetler","aracimiz":"Aracımız","bolgeler":"Hizmet bölgeleri","nedenbiz":"Neden biz","guzergahlar":"Güzergâhlar","tasima-ornekleri":"Taşıma örnekleri","turkiye-haritasi":"Türkiye haritası","yorumlar":"Müşteri yorumları","sss":"Sıkça sorulan sorular","hakkimizda":"Hakkımızda","iletisim":"İletişim"};
const secSelect=document.querySelector("#sectionSelect"),secField=document.querySelector("#sectionField"),secValue=document.querySelector("#sectionValue"),secStatus=document.querySelector("#sectionStatus");
for(const [id,name] of Object.entries(secNames)){const option=document.createElement("option");option.value=id;option.textContent=name;secSelect.append(option)}
let secData={};
async function loadSections(){try{const r=await fetch("/api/admin/sections");if(!r.ok)throw Error("Bölümler okunamadı");secData=await r.json();document.querySelector("#sectionPanel").hidden=false;updateSecValue()}catch(e){secStatus.textContent=e.message}}
function updateSecValue(){secValue.value=secData[secSelect.value+":"+secField.value]||""}
secSelect.addEventListener("change",updateSecValue);secField.addEventListener("change",updateSecValue);
document.querySelector("#saveSection").addEventListener("click",async()=>{secStatus.textContent="Kaydediliyor...";try{const body={section:secSelect.value,field:secField.value,value:secValue.value};const r=await fetch("/api/admin/sections",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||"Kaydedilemedi");secData[body.section+":"+body.field]=body.value;secStatus.textContent="Kaydedildi"}catch(e){secStatus.textContent=e.message}});
const key=document.querySelector("#key"),value=document.querySelector("#value"),status=document.querySelector("#status");let settings={};async function load(){try{const r=await fetch("/api/admin/settings",{credentials:"same-origin"});if(!r.ok)throw Error((await r.json()).error||"Erişim hatası");settings=await r.json();document.querySelector("#form").hidden=false;document.querySelector("#loginForm").hidden=true;document.querySelector("#logout").hidden=false;status.textContent="";show();loadSections();loadContent()}catch(e){status.textContent=e.message}}function show(){value.value=settings[key.value]||""}key.addEventListener("change",show);document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Kaydediliyor...";try{const r=await fetch("/api/admin/settings",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({[key.value]:value.value})});const data=await r.json();if(!r.ok)throw Error(data.error||"Hata");settings[key.value]=value.value;status.textContent="Kaydedildi"}catch(e){status.textContent=e.message}});document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.querySelector("#password").value})});if(!r.ok)throw Error("Giriş başarısız");document.querySelector("#password").value="";await load()}catch(e){status.textContent=e.message}});document.querySelector("#logout").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"});location.reload()});load();</script></body></html>

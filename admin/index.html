<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doğan Nakliyat Yönetim</title><style>body{font:16px system-ui;background:#f3f6fb;color:#17263d;margin:0;padding:24px}main{max-width:740px;margin:auto}section{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 24px #10213c12}label{display:block;margin:16px 0 5px;font-weight:700}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aab8ca;border-radius:8px;font:inherit}button{margin-top:18px;background:#10213c;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}#status{white-space:pre-wrap}</style></head><body><main><h1>Doğan Nakliyat — Yönetim</h1><p>Yalnızca Cloudflare Access tarafından doğrulanan yöneticiler erişebilir.</p><section><form id="loginForm"><label for="password">Yönetici şifresi</label><input id="password" type="password" autocomplete="current-password" required><button>Giriş yap</button></form><button id="logout" type="button" hidden>Çıkış yap</button><form id="form" hidden><label for="key">Düzenlenecek alan</label><select id="key"><option value="heroTitle">Ana başlık</option><option value="heroSubtitle">Alt başlık</option><option value="phone">Telefon</option><option value="whatsapp">WhatsApp</option><option value="serviceDescription">Hizmet açıklaması</option></select><label for="value">İçerik</label><textarea id="value" rows="5" maxlength="2000" required></textarea><button>Kaydet</button></form><p id="status" role="status"></p></section></main><script>const key=document.querySelector("#key"),value=document.querySelector("#value"),status=document.querySelector("#status");let settings={};async function load(){try{const r=await fetch("/api/admin/settings",{credentials:"same-origin"});if(!r.ok)throw Error((await r.json()).error||"Erişim hatası");settings=await r.json();document.querySelector("#form").hidden=false;document.querySelector("#loginForm").hidden=true;document.querySelector("#logout").hidden=false;status.textContent="";show()}catch(e){status.textContent=e.message}}function show(){value.value=settings[key.value]||""}key.addEventListener("change",show);document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();status.textContent="Kaydediliyor...";try{const r=await fetch("/api/admin/settings",{method:"PUT",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({[key.value]:value.value})});const data=await r.json();if(!r.ok)throw Error(data.error||"Hata");settings[key.value]=value.value;status.textContent="Kaydedildi"}catch(e){status.textContent=e.message}});document.querySelector("#loginForm").addEventListener("submit",async e=>{e.preventDefault();try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.querySelector("#password").value})});if(!r.ok)throw Error("Giriş başarısız");document.querySelector("#password").value="";await load()}catch(e){status.textContent=e.message}});document.querySelector("#logout").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"});location.reload()});load();</script></body></html>
